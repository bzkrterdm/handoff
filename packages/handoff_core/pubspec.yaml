name: handoff_core
description: >-
  The task format and the folder store behind Handoff, in plain Dart: shared
  by the desktop app and the terminal app so both read and edit task files
  the same way.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.12.0

dependencies:
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  path: ^1.9.0
  watcher: ^1.1.0
  yaml: ^3.1.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
