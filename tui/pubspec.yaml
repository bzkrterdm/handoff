name: handoff_tui
description: >-
  Handoff in the terminal: the same inbox as the desktop app, for macOS,
  Linux and Windows, as a single binary.
publish_to: 'none'
version: 0.2.0

environment:
  sdk: ^3.12.0

executables:
  handoff: handoff

dependencies:
  handoff_core:
    path: ../packages/handoff_core
  path: ^1.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
